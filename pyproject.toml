[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conflict-projection"
version = "0.1.0"
description = "Conflict-constrained information projection experiments for retrieval-augmented QA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "datasets>=2.20,<4",
  "huggingface-hub>=0.24,<1",
  "numpy>=1.26,<3",
  "openai>=1.40,<3",
  "pandas>=2.1,<3",
  "pyarrow>=15,<24",
  "rank-bm25>=0.2.2,<1",
  "scikit-learn>=1.4,<2",
  "sentence-transformers>=3,<6",
  "vaderSentiment>=3.3.2,<4",
]

[project.optional-dependencies]
dev = [
  "ipykernel>=6.29,<7",
  "jupyterlab>=4,<5",
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
